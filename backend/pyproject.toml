[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeiq-api"
version = "0.1.0"
description = "TradeIQ Journal API"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "cryptography>=43",
    "metaapi-cloud-sdk>=29,<30",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "pwdlib[argon2]>=0.2,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]
mt5-worker = [
    "MetaTrader5>=5.0.45; platform_system == 'Windows'",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
