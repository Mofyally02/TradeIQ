services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tradeiq
      POSTGRES_USER: tradeiq
      POSTGRES_PASSWORD: tradeiq_dev_only
    volumes:
      - tradeiq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeiq -d tradeiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://tradeiq:tradeiq_dev_only@db:5432/tradeiq
      WEB_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      ENVIRONMENT: development
      COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  tradeiq-postgres-data:
